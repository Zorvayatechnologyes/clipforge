name: probe

on:
  push:
    paths:
      - 'tools/probe.py'
      - '.github/workflows/probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install
        run: pip install -q yt-dlp
      - name: probe
        run: python tools/probe.py || true
      - name: save result
        run: |
          git config user.name clipforge-probe
          git config user.email probe@users.noreply.github.com
          git add -f probe.txt
          git commit -m "probe result" || true
          git push || true
